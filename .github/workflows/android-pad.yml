name: Build Android tablet app
on:
  push:
    branches: [main, android-pad]
    paths:
      - 'playedu-android/**'
      - '.github/workflows/android-pad.yml'
      - 'scripts/test-playback.mjs'
      - 'playedu-h5/src/utils/playback.ts'
      - 'playedu-pc/src/utils/playback.ts'
  pull_request:
    paths: ['playedu-android/**', '.github/workflows/android-pad.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-tablet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify learning progress checkpoint
        run: |
          npx --yes pnpm@8.15.9 --dir playedu-pc install --frozen-lockfile
          node scripts/test-playback.mjs
      - name: Build and check Android app
        run: gradle -p playedu-android --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Prepare Android outputs
        run: |
          mkdir -p android-output
          cp playedu-android/app/build/outputs/apk/debug/app-debug.apk android-output/5927-classroom-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 playedu-android/app/build/outputs/apk/release/app-release-unsigned.apk android-output/5927-classroom-unsigned.apk
          cp playedu-android/README.zh-CN.md android-output/
          printf '%s\n' 'Source commit: ${{ github.sha }}' > android-output/BUILD.txt
          sha256sum android-output/*.apk > android-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-tablet-build
          path: android-output/
          retention-days: 14
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test app lifecycle and fullscreen on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_tablet
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle -p playedu-android --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            playedu-android/app/build/reports/
            playedu-android/app/build/outputs/androidTest-results/
          retention-days: 14
