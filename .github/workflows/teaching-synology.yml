name: Build teaching site for Synology
on:
  push:
    branches: [main, teaching-synology, teaching-auto-tls, nas-video-library, bulk-video-controls, course-hour-ordering, video-upload-limits]
  pull_request:
  workflow_dispatch:
concurrency:
  group: teaching-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  certificates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build certificate services
        run: |
          docker build -f deploy/synology/Dockerfile.tls --target gateway -t playedu-teaching-gateway:local .
          docker build -f deploy/synology/Dockerfile.tls --target acme -t playedu-teaching-acme:local .
      - name: Exercise ACME issuance, renewal and live certificate reload
        run: sudo python3 scripts/smoke-auto-tls.py
      - name: Package certificate upgrade
        run: |
          mkdir -p auto-tls-upgrade
          cp deploy/synology/compose.yaml deploy/synology/gateway.conf.template deploy/synology/acme.env.example deploy/synology/aliyun-dns-policy.json deploy/synology/AUTO-TLS.zh-CN.md deploy/synology/setup-auto-certificate.html auto-tls-upgrade/
          printf '%s\n' "Source commit: ${{ github.sha }}" > auto-tls-upgrade/BUILD.txt
          docker save playedu-teaching-gateway:local playedu-teaching-acme:local | gzip > auto-tls-upgrade/auto-tls-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: playedu-auto-tls-upgrade
          path: auto-tls-upgrade/
          retention-days: 14
  build:
    needs: certificates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build desktop, mobile and admin interfaces
        env:
          VITE_APP_URL: /api/
        run: |
          npx --yes pnpm@8.15.9 --dir playedu-pc install --frozen-lockfile
          npx --yes pnpm@9.15.9 --dir playedu-h5 install --frozen-lockfile
          npx --yes pnpm@9.15.9 --dir playedu-admin install --frozen-lockfile
          node scripts/test-playback.mjs
          node scripts/test-video-upload.mjs
          npx --yes pnpm@8.15.9 --dir playedu-pc build
          npx --yes pnpm@9.15.9 --dir playedu-h5 build
          npx --yes pnpm@9.15.9 --dir playedu-admin build
      - name: Test and package backend
        working-directory: playedu-api
        run: |
          chmod +x mvnw
          ./mvnw -B test package
      - uses: actions/download-artifact@v4
        with:
          name: playedu-auto-tls-upgrade
          path: auto-tls-upgrade/
      - name: Load tested certificate services
        run: docker load -i auto-tls-upgrade/auto-tls-images.tar.gz
      - name: Build NAS images
        run: |
          docker build -f deploy/synology/Dockerfile --target api -t playedu-teaching-api:local .
          docker build -f deploy/synology/Dockerfile --target web -t playedu-teaching-web:local .
          docker tag playedu-teaching-api:local playedu-teaching-api:uploads-v1
          docker tag playedu-teaching-web:local playedu-teaching-web:uploads-v1
          docker pull mysql:8.4
          docker pull chrislusf/seaweedfs:4.51
      - name: Verify container startup, TLS and private video storage
        run: |
          python -m pip install boto3
          python scripts/smoke-synology.py
      - name: Verify direct NAS playback, browser import and learning resume
        env:
          NAS_BROWSER_PACKAGE: /tmp/playedu-nas-browser
        run: |
          npm install --no-save --prefix "$NAS_BROWSER_PACKAGE" playwright@1.64.1
          "$NAS_BROWSER_PACKAGE/node_modules/.bin/playwright" install --with-deps chromium
          python scripts/smoke-nas-library.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playedu-nas-browser-results
          path: nas-browser-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package individual NAS upgrade images
        if: github.event_name != 'pull_request'
        run: python scripts/package-nas-upgrade.py
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: playedu-nas-library-upgrade
          path: nas-library-upgrade/
          retention-days: 14
      - name: Create importable Synology bundle
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p synology-bundle
          cp deploy/synology/compose.yaml deploy/synology/gateway.conf.template deploy/synology/prepare.sh deploy/synology/README.zh-CN.md synology-bundle/
          cp deploy/synology/.env.example deploy/synology/acme.env.example deploy/synology/aliyun-dns-policy.json deploy/synology/AUTO-TLS.zh-CN.md deploy/synology/setup-auto-certificate.html synology-bundle/
          printf '%s\n' "Source commit: ${{ github.sha }}" > synology-bundle/BUILD.txt
          docker save playedu-teaching-api:local playedu-teaching-web:local mysql:8.4 chrislusf/seaweedfs:4.51 playedu-teaching-gateway:local playedu-teaching-acme:local | gzip > synology-bundle/images.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: playedu-synology
          path: synology-bundle/
          include-hidden-files: true
          retention-days: 3
