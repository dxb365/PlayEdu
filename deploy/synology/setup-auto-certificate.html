<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>免费证书自动续期设置</title><style>*{box-sizing:border-box}body{margin:0;padding:30px 16px;background:#f3f6fc;color:#182747;font:17px/1.8 'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:720px;margin:auto;background:white;padding:32px;border-radius:22px}h1{font-size:29px;margin:0 0 12px}p{color:#60708b}label{display:block;margin-top:18px;font-weight:600}input{font:inherit;width:100%;padding:12px;border:1px solid #cdd7e8;border-radius:10px;margin-top:6px}input:focus{outline:3px solid #dce5ff}button{margin-top:24px;background:#4168ee;color:white;border:0;border-radius:10px;padding:15px 22px;font:600 17px 'Microsoft YaHei',sans-serif;cursor:pointer}button:disabled{opacity:.6;cursor:default}code{background:#eff3fb;padding:2px 4px}#status{white-space:pre-line;margin-top:20px}.error{color:#af3030}.ok{color:#216645}.note{font-size:14px}footer{border-top:1px solid #e2e8f3;margin-top:24px;padding-top:15px;font-size:14px;color:#60708b}</style></head><body><main><h1>免费证书自动续期</h1><p>域名：<b>www.5927.fun</b><br>当前使用阿里云解析。填入为这次续期创建的 RAM 用户密钥。内容仅在本机生成文件，不会上传网络。</p><form id="setup"><label>联系邮箱<input name="email" id="email" type="email" required autocomplete="email"></label><label>AccessKey ID<input id="key" type="password" required autocomplete="off" spellcheck="false"></label><label>AccessKey Secret<input id="secret" type="password" required autocomplete="off" spellcheck="false"></label><button id="download" type="submit">生成并下载 acme.env</button></form><div id="status" role="status" aria-live="polite"></div><footer>将下载的 <code>acme.env</code> 上传到群晖部署文件夹中的 <code>acme-config</code> 子文件夹。原来的 <code>.env</code> 保留，不需要修改。不要将这两个配置文件发到聊天或上传 GitHub。申请完成后，系统定期检查并自动续期、加载新证书。此配置只管理教学网站，不修改群晖 5001 使用的证书。</footer></main><script>
const setup=document.getElementById('setup');setup.addEventListener('submit',event=>{event.preventDefault();const status=document.getElementById('status');try{const email=document.getElementById('email').value.trim();const key=document.getElementById('key').value.trim();const secret=document.getElementById('secret').value.trim();if(!/^[A-Za-z0-9.!%+_-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email))throw Error('请输入有效的联系邮箱。');if(!/^[A-Za-z0-9+/=_-]{16,128}$/.test(key)||!/^[A-Za-z0-9+/=_-]{16,128}$/.test(secret))throw Error('请粘贴完整的 AccessKey ID 和 Secret，不要使用示例文字。');const content=['ACME_EMAIL='+email,'Ali_Key='+key,'Ali_Secret='+secret,'ACME_DNS_WAIT=180',''].join('\n');const url=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='acme.env';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);document.getElementById('key').value='';document.getElementById('secret').value='';document.getElementById('download').disabled=true;status.className='ok';status.textContent='已请求下载 acme.env。\n请上传到群晖 docker/playedu-teaching/acme-config 文件夹。\n已有的网站 .env 文件继续保留。';}catch(error){status.className='error';status.textContent=error.message;}});
</script></body></html>
