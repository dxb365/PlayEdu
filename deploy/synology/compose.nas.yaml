name: playedu-teaching
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: playedu
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Generate .env first}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging
  storage:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?Generate .env first}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?Generate .env first}
      S3_BUCKET: videos
    volumes:
      - ./storage:/data
    logging: *logging
  api:
    image: playedu-teaching-api:nas-v1
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: playedu
      DB_USER: root
      DB_PASS: ${DB_PASSWORD:?Generate .env first}
      SA_TOKEN_JWT_SECRET_KEY: ${JWT_SECRET:?Generate .env first}
      JAVA_TOOL_OPTIONS: '-Xms256m -Xmx1024m'
      TZ: Asia/Shanghai
      TEACHING_S3_INTERNAL_ENDPOINT: http://storage:8333
      TEACHING_S3_PUBLIC_ENDPOINT: https://${DOMAIN:-www.5927.fun}:${STORAGE_HTTPS_PORT:-9443}
      TEACHING_S3_PATH_STYLE: 'true'
      TEACHING_S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Generate .env first}
      TEACHING_S3_SECRET_KEY: ${STORAGE_SECRET_KEY:?Generate .env first}
      TEACHING_S3_BUCKET: videos
      TEACHING_S3_REGION: us-east-1
      TEACHING_NAS_VIDEO_ROOT: /nas-videos
      TEACHING_NAS_PUBLIC_URL: https://${DOMAIN:-www.5927.fun}:${WEB_HTTPS_PORT:-8443}/api/nas-media
      TEACHING_NAS_ADMIN_ORIGIN: http://${ADMIN_BIND_IP:-127.0.0.1}:${ADMIN_PORT:-9900}
    volumes:
      - type: bind
        source: ${NAS_VIDEO_DIR:?Set NAS_VIDEO_DIR in .env}
        target: /nas-videos
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    logging: *logging
  web:
    image: playedu-teaching-web:nas-v1
    restart: unless-stopped
    ports:
      - '${ADMIN_BIND_IP:-127.0.0.1}:${ADMIN_PORT:-9900}:8081'
    depends_on:
      - api
    logging: *logging
  certificate-manager:
    image: playedu-teaching-acme:local
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-www.5927.fun}
      AUTO_UPGRADE: '0'
      TEACHING_ACME_SERVER: ${TEACHING_ACME_SERVER:-https://acme.zerossl.com/v2/DV90}
      TEACHING_ACME_HOME: ${TEACHING_ACME_HOME:-/acme.sh/zerossl}
    volumes:
      - ./acme-config:/run/acme-config:ro
      - ./acme-state:/acme.sh
      - ./certs:/certs
    healthcheck:
      test: ["CMD-SHELL", "openssl x509 -in /certs/current/tls.crt -noout -checkend 604800 >/dev/null 2>&1"]
      interval: 1h
      timeout: 10s
      start_period: 20m
      retries: 2
    logging: *logging
  gateway:
    image: playedu-teaching-gateway:local
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-www.5927.fun}
      WEB_HTTPS_PORT: ${WEB_HTTPS_PORT:-8443}
      ADMIN_BIND_IP: ${ADMIN_BIND_IP:-127.0.0.1}
      ADMIN_PORT: ${ADMIN_PORT:-9900}
    ports:
      - '${WEB_HTTPS_PORT:-8443}:8443'
      - '${STORAGE_HTTPS_PORT:-9443}:9443'
    volumes:
      - ./gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/teaching/certs:ro
    depends_on:
      - web
      - storage
    logging: *logging
